name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-26.04
    container: python3.15@sha256:46837ed3105db0029b6d656816185c6258e3b39690532fb782428e0a5fd76182
    steps:
      - uses: actions/checkout@v7.0.1
      - run: apt-get update && apt-get install -y git
      - run: pip install --pylock pylock.toml
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --no-fix
